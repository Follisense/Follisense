name: Secrets check
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on VITE_-prefixed secrets
        run: |
          if grep -rnE "VITE_[A-Z0-9_]*(_KEY|_SECRET|_TOKEN)" src/ \
             | grep -vE "VITE_SUPABASE_ANON_KEY|VITE_POSTHOG_PROJECT_TOKEN|VITE_FLUTTERWAVE_PUBLIC_KEY"; then
            echo "Found a VITE_-prefixed secret in src/. Anything VITE_ ends up in the browser bundle."
            exit 1
          fi